name: Markdown Lint
on: [pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install mdl
      run: |
        sudo apt-get update
        sudo apt-get install -y markdownlint
    - name: Run markdown-lint
      run: ./scripts/markdownlint_wrapper.sh check
